name: Bug report
description: Report a reproducible KeyBridge problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KeyBridge version on both PCs
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version, display resolution, and scaling on both PCs
      placeholder: Windows 11, 1920x1080, 125%
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: Add relevant status messages or screenshots. Remove connection codes, pairing tokens, and private information. Do not report security vulnerabilities here; see SECURITY.md.
